<div class="user-container">
  <h2>Manage Users</h2>

  <button class="create-btn" *ngIf="!showForm" (click)="openCreateForm()">
    Create User
  </button>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <form *ngIf="showForm" (ngSubmit)="submitUser()" class="user-form">
    <input type="text" placeholder="Username" [(ngModel)]="user.userName" name="userName" required>
    <input type="email" placeholder="Email" [(ngModel)]="user.email" name="email" required>
    <input type="text" placeholder="First Name" [(ngModel)]="user.firstName" name="firstName">
    <input type="text" placeholder="Last Name" [(ngModel)]="user.lastName" name="lastName">
    <input type="text" placeholder="Phone Number" [(ngModel)]="user.phoneNumber" name="phoneNumber">
    <input type="text" placeholder="Address" [(ngModel)]="user.address" name="address">

    <select [(ngModel)]="user.roles" name="roles">
      <option value="USER">USER</option>
      <option value="ADMIN">ADMIN</option>
    </select>

    <button class="submit-btn" type="submit">
      {{ isEditMode ? 'Update User' : 'Create User' }}
    </button>

    <button class="cancel-btn" type="button" (click)="resetForm()">
      Cancel
    </button>
  </form>

  <table *ngIf="!showForm">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Full Name</th>
        <th>Phone</th>
        <th>Role</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let user of users">
        <td>{{ user.id }}</td>
        <td>{{ user.userName }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.firstName }} {{ user.lastName }}</td>
        <td>{{ user.phoneNumber }}</td>
        <td>{{ user.roles }}</td>

        <td>
          <button class="edit-btn" (click)="editUser(user)">Edit</button>
          <button class="delete-btn" (click)="deleteUser(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
