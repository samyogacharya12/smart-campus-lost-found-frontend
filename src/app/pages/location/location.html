<!-- Create Button -->

<button *ngIf="!showForm" (click)="toggleForm()" class="create-btn">
  Create Location
</button>

<!-- Form -->
<div *ngIf="showForm">
  <form class="location-form" (ngSubmit)="saveLocation()">

    <h2>Create Location</h2>

    <div class="form-group">
      <label>Location Name</label>
      <input
        type="text"
        name="locationName"
        [(ngModel)]="locationName"
        required
      />
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        name="description"
        [(ngModel)]="description"
        required
      ></textarea>
    </div>

    <div class="button-group">
      <button type="button" (click)="closeForm()">Cancel</button>
      <button type="submit">Save Location</button>
    </div>

  </form>
</div>

<!-- Location List -->
<div *ngIf="!showForm">
  <h2>Location List</h2>
  <p *ngIf="isLoading">Loading locations...</p>

  <table *ngIf="!isLoading && locations" class="location-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Description</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let loc of locations">
        <td>{{ loc?.locationId }}</td>
        <td>{{ loc?.locationName }}</td>
        <td>{{ loc?.locationDescription }}</td>
      </tr>
    </tbody>
  </table>

  <p *ngIf="!isLoading && locations.length === 0">
    No locations found
  </p>
</div>
