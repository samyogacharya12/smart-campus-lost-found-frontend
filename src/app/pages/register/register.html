<div class="register-container">
  <h2>Register</h2>

<p class="success" *ngIf="successMessage">
  {{ successMessage }}
</p>

<p class="error" *ngIf="errorMessage">
  {{ errorMessage }}
</p>

  <form (ngSubmit)="register()">

    <div class="form-row">
      <div>
        <label>First Name</label>
        <input type="text" [(ngModel)]="firstName" name="firstName" required />
      </div>

      <div>
        <label>Last Name</label>
        <input type="text" [(ngModel)]="lastName" name="lastName" required />
      </div>
    </div>

    <div>
      <label>Username</label>
      <input type="text" [(ngModel)]="userName" name="userName" required />
    </div>

    <div>
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>

    <div>
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>

    <div>
      <label>Phone Number</label>
      <input type="text" [(ngModel)]="phoneNumber" name="phoneNumber" required />
    </div>

    <div>
      <label>Address</label>
      <input type="text" [(ngModel)]="address" name="address" required />
    </div>

    <button type="submit">Register</button>

    <p class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

  </form>
</div>
