<div class="login-container">
  <h2>Login</h2>

  <form (ngSubmit)="login()">
    <div>
      <label>Username</label>
      <input
        type="text"
        name="userName"
        [(ngModel)]="userName"
        required
      />
    </div>

    <div>
      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <button type="submit">Login</button>

    <p style="color: red;" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>
  </form>
</div>
