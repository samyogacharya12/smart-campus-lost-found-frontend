<div class="item-container">

  <h2>{{ pageTitle }}</h2>

  <p class="success" *ngIf="successMessage">{{ successMessage }}</p>
  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table>
    <thead>
      <tr>
        <th>Item Name</th>
        <th>Location</th>
        <th>User</th>
        <th>Date</th>
        <th>Status</th>
        <th>Image</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.title }}</td>
        <td>{{ item.locationName }}</td>
        <td>{{ item.userName }}</td>
        <td>{{ item.dateLostOrFound }}</td>
           <td>
          <span
            [ngClass]="{
              'open': item.status === 'OPEN',
              'claimed': item.status === 'CLAIMED',
              'returned': item.status === 'RETURNED',
              'closed': item.status === 'CLOSED'
            }">
            {{ item.status }}
          </span>
        </td>
    <td>
          <a
  [href]="'http://localhost:8080/item/images/download/' + item.imageId + '/' + item.itemId"
  target="_blank">
          <img
         [src]="'http://localhost:8080/item/images/download/' + item.imageId + '/' + item.itemId"
           class="item-image"
             target="_blank"
         /> </a> </td>
      </tr>
    </tbody>
  </table>

</div>
